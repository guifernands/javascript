<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo</title>
</head>
<body>

    <section class="container">

        <h1>Gerador de senhas</h1>
        <div class="generated-pw"></div>

        <form>
            <label>Quantidade de caracteres:</label>
            <input type="number" class="characters">

            <label>Adicionar números:</label>
            <input type="checkbox" class="withNumbers">

            <label>Letras maiúsculas:</label>
            <input type="checkbox" class="withUpper">

            <label>Letras minúsculas</label>
            <input type="checkbox" class="withLower">

            <label>Letras símbolos:</label>
            <input type="checkbox" class="withSymbols">

            <button class="generate">Gerar senha</button>
        </form>
    </section>
    
    <script src="./assets/js/bundle.js"></script>
</body>
</html>
